<g id="tekst">
	<text transform="matrix(1 0 0 1 195.5887 40.6785)"><tspan x="0" y="0" class="st13 st8 st9">What does the user see?</tspan><tspan x="-27.19" y="12" class="st13 st8 st9">Environment, friends, social context...</tspan></text>
	<text transform="matrix(1 0 0 1 373.011 40.6785)"><tspan x="0" y="0" class="st13 st8 st9">What does the user hear?</tspan><tspan x="9.89" y="12" class="st13 st8 st9">Influences, sounds,...</tspan></text>
	<text transform="matrix(1 0 0 1 542.9808 40.6785)"><tspan x="0" y="0" class="st13 st8 st9">What does the user do or say ?</tspan><tspan x="11.11" y="12" class="st13 st8 st9">Toward others, attitude...</tspan></text>
	<text transform="matrix(1 0 0 1 893.4238 40.6785)"><tspan x="0" y="0" class="st13 st8 st9">What does the user feel as negative?</tspan><tspan x="0.8" y="12" class="st13 st8 st9">Frustrations, obstacles, limitations,...</tspan></text>
	<text transform="matrix(1 0 0 1 1090.6439 40.6785)"><tspan x="0" y="0" class="st13 st8 st9">What does the user desire?</tspan><tspan x="19.58" y="12" class="st13 st8 st9">Whishes, needs,...</tspan></text>
	<text transform="matrix(1 0 0 1 720.7974 40.6785)"><tspan x="0" y="0" class="st13 st8 st9">What does the user think or feel?</tspan><tspan x="17.36" y="12" class="st13 st8 st9">Motivations, emotions,...</tspan></text>
	<text transform="matrix(1 0 0 1 195.5887 370.8829)"><tspan x="0" y="0" class="st13 st8 st9">What does the user see?</tspan><tspan x="-27.19" y="12" class="st13 st8 st9">Environment, friends, social context...</tspan></text>
	<text transform="matrix(1 0 0 1 373.011 370.8829)"><tspan x="0" y="0" class="st13 st8 st9">What does the user hear?</tspan><tspan x="9.89" y="12" class="st13 st8 st9">Influences, sounds,...</tspan></text>
	<text transform="matrix(1 0 0 1 542.9808 370.8829)"><tspan x="0" y="0" class="st13 st8 st9">What does the user do or say ?</tspan><tspan x="11.11" y="12" class="st13 st8 st9">Toward others, attitude...</tspan></text>
	<text transform="matrix(1 0 0 1 893.4238 370.8829)"><tspan x="0" y="0" class="st13 st8 st9">What does the user feel as negative?</tspan><tspan x="0.8" y="12" class="st13 st8 st9">Frustrations, obstacles, limitations,...</tspan></text>
	<text transform="matrix(1 0 0 1 1090.6439 370.8829)"><tspan x="0" y="0" class="st13 st8 st9">What does the user desire?</tspan><tspan x="19.58" y="12" class="st13 st8 st9">Whishes, needs,...</tspan></text>
	<text transform="matrix(1 0 0 1 720.7974 370.8829)"><tspan x="0" y="0" class="st13 st8 st9">What does the user think or feel?</tspan><tspan x="17.36" y="12" class="st13 st8 st9">Motivations, emotions,...</tspan></text>
	<text transform="matrix(0 -1 1 0 104.7353 348.9849)" class="st8 st14">EMPATHY MAPPING</text>
	<text transform="matrix(1 0 0 1 118.0594 18.3474)" class="st8 st14">HUMAN BASIC LEVEL </text>
	<text transform="matrix(1 0 0 1 117.1198 568.7769)" class="st8 st14">AI FACILITATOR</text>
	<text transform="matrix(0.7071 -0.7071 0.7071 0.7071 21.1771 285.1602)" class="st8 st9">USER CENTERED</text>
	<text transform="matrix(0.7071 -0.7071 0.7071 0.7071 1560.8917 285.6006)" class="st8 st9">USER INSIGHTS</text>
	<text transform="matrix(1 0 0 1 225.8609 260.8798)"><tspan x="0" y="0" class="st13 st8 st9">Give a short description of </tspan><tspan x="0" y="12" class="st13 st8 st9">the challenge.</tspan><tspan x="0" y="24" class="st13 st8 st9"> </tspan><tspan x="0" y="36" class="st13 st8 st9">Keep this description </tspan><tspan x="0" y="48" class="st13 st8 st9">concise and brief.</tspan></text>
	<path class="st5" d="M766.99,333.93H622.58c-3.12,0-5.67-2.55-5.67-5.67v-76.99c0-3.12,2.55-5.67,5.67-5.67h144.41
		c3.12,0,5.67,2.55,5.67,5.67v76.99C772.65,331.38,770.1,333.93,766.99,333.93z"/>
	<text transform="matrix(1 0 0 1 645.5586 263.7115)"><tspan x="0" y="0" class="st13 st8 st9">Step into the shoes of </tspan><tspan x="0" y="12" class="st13 st8 st9">your user and try to </tspan><tspan x="0" y="24" class="st13 st8 st9">understand them better. </tspan><tspan x="0" y="48" class="st13 st8 st9">Do this specifically for </tspan><tspan x="0" y="60" class="st13 st8 st9">these six challenges.</tspan></text>
	<text transform="matrix(1 0 0 1 1305.6536 18.3474)" class="st8 st14">CONCLUSIONS</text>
	<text transform="matrix(1 0 0 1 1366.7063 37.7087)" class="st13 st8 st9">What does the user see?</text>
	<text transform="matrix(1 0 0 1 1364.3713 126.1557)" class="st13 st8 st9">What does the user hear?</text>
	<text transform="matrix(1 0 0 1 1353.8265 212.9473)" class="st13 st8 st9">What does the user do or say ?</text>
	<text transform="matrix(1 0 0 1 1334.0999 387.2444)" class="st13 st8 st9">What does the user experience as negative?</text>
	<text transform="matrix(1 0 0 1 1361.0814 475.0211)" class="st13 st8 st9">What does the user desire?</text>
	<text transform="matrix(1 0 0 1 1348.8267 301.1488)" class="st13 st8 st9">What does the user think or feel?</text>
</g>
